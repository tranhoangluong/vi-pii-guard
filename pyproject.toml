[project]
name = "vi-pii-guard"
version = "0.1.0"
description = "Vietnamese PII detection and reversible redaction before text is sent to an LLM"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Hoang Luong Tran" }]
keywords = ["pii", "vietnamese", "redaction", "anonymization", "llm", "privacy", "nlp", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Vietnamese",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
# The core library (detect/redact/restore) has no third-party dependencies.
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]
ner = [
    "transformers>=4.44",
    "torch>=2.3",
]
train = [
    "vi-pii-guard[ner]",
    "accelerate>=0.33",
    "mlflow>=2.15",
]

[project.scripts]
vi-pii-guard = "vi_pii_guard.cli:main"

[project.urls]
Homepage = "https://github.com/tranhoangluong/vi-pii-guard"
Issues = "https://github.com/tranhoangluong/vi-pii-guard/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vi_pii_guard"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "S"]
ignore = [
    "E501",    # ruff format owns line length; long Vietnamese template strings are fine
    "RUF001",  # Vietnamese text legitimately contains look-alike characters
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S311"]
"src/vi_pii_guard/synth/**" = ["S311"]  # synthetic data, not cryptography

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["vi_pii_guard"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["transformers.*", "torch.*", "mlflow.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-q --doctest-modules"
markers = ["slow: needs a downloaded model"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["vi_pii_guard"]
branch = true
